<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083c3a"/>
      <stop offset="60%" stop-color="#0E5F5C"/>
      <stop offset="100%" stop-color="#167e7a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative Rings / Geometry -->
  <circle cx="1050" cy="150" r="320" fill="none" stroke="#8FB996" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="1050" cy="150" r="220" fill="none" stroke="#FF6F59" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="150" cy="550" r="280" fill="none" stroke="#8FB996" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Hospital Icon Emblem -->
  <rect x="120" y="140" width="100" height="100" rx="24" fill="#FFFFFF"/>
  <rect x="136" y="178" width="68" height="24" rx="6" fill="#0E5F5C"/>
  <rect x="158" y="156" width="24" height="68" rx="6" fill="#0E5F5C"/>
  <circle cx="170" cy="190" r="8" fill="#FF6F59"/>

  <!-- Brand Typography -->
  <text x="250" y="210" font-family="'Poppins', sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF">
    Harborlight Hospital
  </text>

  <!-- Tagline -->
