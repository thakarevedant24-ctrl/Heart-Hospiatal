  </text>
  <text x="120" y="445" font-family="'Inter', sans-serif" font-size="24" fill="#FAF7F2" fill-opacity="0.9">
    &bull; Pediatrics &amp; Neonatal Care &nbsp;&nbsp;&bull; Orthopedics &amp; Joint Reconstruction &nbsp;&nbsp;&bull; Advanced Diagnostics
  </text>

  <!-- Bottom Details Bar -->
  <line x1="120" y1="510" x2="1080" y2="510" stroke="#8FB996" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="120" y="555" font-family="'Inter', sans-serif" font-size="20" fill="#8FB996">
    12 Wellness Avenue, Riverdale, TX 75001 &nbsp;|&nbsp; 24/7 Line: +1 (555) 010-7890 &nbsp;|&nbsp; info@harborlighthospital.example
