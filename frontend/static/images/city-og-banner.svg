<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08233D"/>
      <stop offset="60%" stop-color="#0F3D69"/>
      <stop offset="100%" stop-color="#185896"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative Rings / Geometry -->
  <circle cx="1050" cy="150" r="320" fill="none" stroke="#059669" stroke-width="2" stroke-opacity="0.25"/>
  <circle cx="1050" cy="150" r="220" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.35"/>
  <circle cx="150" cy="550" r="280" fill="none" stroke="#059669" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Hospital Icon Emblem -->
  <rect x="120" y="140" width="100" height="100" rx="24" fill="#FFFFFF"/>
  <rect x="136" y="178" width="68" height="24" rx="6" fill="#0F3D69"/>
  <rect x="158" y="156" width="24" height="68" rx="6" fill="#0F3D69"/>
  <circle cx="170" cy="190" r="8" fill="#0284C7"/>

  <!-- Brand Typography -->
  <text x="250" y="210" font-family="'Poppins', sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF">
    City Heart Hospital
  </text>

  <!-- Tagline -->
  <text x="120" y="320" font-family="'Poppins', sans-serif" font-size="36" font-weight="600" fill="#38BDF8">
    "Advanced Cardiology &amp; Cardiothoracic Surgery"
  </text>

  <!-- Key Clinical Highlights -->
  <text x="120" y="400" font-family="'Inter', sans-serif" font-size="24" fill="#F8FAFC" fill-opacity="0.95">
    &bull; 24/7 Chest Pain &amp; STEMI Center &nbsp;&nbsp;&bull; Hybrid Cath Lab Angioplasty &nbsp;&nbsp;&bull; CTVS Heart Bypass (CABG)
  </text>
  <text x="120" y="445" font-family="'Inter', sans-serif" font-size="24" fill="#F8FAFC" fill-opacity="0.95">
    &bull; Arrhythmia &amp; 3D Mapping &nbsp;&nbsp;&bull; Pediatric Heart Surgery &nbsp;&nbsp;&bull; Non-Invasive 3D Echo Diagnostics
  </text>

  <!-- Bottom Details Bar -->
  <line x1="120" y1="510" x2="1080" y2="510" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.35"/>
  <text x="120" y="555" font-family="'Inter', sans-serif" font-size="20" fill="#94A3B8">
    BKC, Bandra East, Mumbai, Maharashtra 400051 &nbsp;|&nbsp; 24/7 Chest Pain Hotline: +91XXXXXXXX50 &nbsp;|&nbsp; info@cityhearthospital.example
  </text>
</svg>

