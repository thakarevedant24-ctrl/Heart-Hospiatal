<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#185896"/>
      <stop offset="100%" stop-color="#0F3D69"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield / Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#navyGrad)" filter="url(#dropShadow)"/>

  <!-- Subtle Border Ring -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Medical Cross Horizontal Bar -->
  <rect x="14" y="26" width="36" height="12" rx="4" fill="#FFFFFF"/>

  <!-- Medical Cross Vertical Bar -->
  <rect x="26" y="14" width="12" height="36" rx="4" fill="#FFFFFF"/>

  <!-- City Heart Hospital Medical Cerulean Beacon / Spark in Center -->
  <circle cx="32" cy="32" r="5" fill="#0284C7"/>
  <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>
</svg>

