{% load static %}
<header class="site-header">
  <!-- Thin Top Bar -->
  <div class="top-bar">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <a href="tel:+15550107890" aria-label="Call Hospital">
          <i class="bi bi-telephone-fill text-accent" style="color: var(--accent-color);"></i>
          <span><strong>Call:</strong> +1 (555) 010-7890</span>
        </a>
        <span class="d-none d-lg-inline opacity-50">|</span>
        <span class="d-none d-lg-inline text-white-50">
          <i class="bi bi-geo-alt-fill me-1" style="color: var(--support-color);"></i>12 Wellness Avenue, Riverdale, TX
        </span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="emergency-badge d-none d-sm-inline-flex align-items-center gap-1">
          <i class="bi bi-clock-fill"></i> 24/7 Emergency Care
        </span>
        <a href="mailto:info@harborlighthospital.example" class="d-none d-md-inline-flex align-items-center">
          <i class="bi bi-envelope-fill me-1"></i> info@harborlighthospital.example
        </a>
      </div>
    </div>
  </div>

  <!-- Main Sticky Navbar -->
  <nav class="navbar-custom">
    <div class="container navbar-container">
      <!-- Hospital Logo and Name (Left) -->
      <a class="navbar-brand-wrapper" href="{% url 'core:home' %}">
        <div class="navbar-logo-icon">
          <i class="bi bi-hospital"></i>
        </div>
        <div class="brand-text-block">
          <span class="brand-name">Harborlight</span>
          <span class="brand-tagline-text">Compassionate Care, Modern Medicine</span>
        </div>
      </a>

      <!-- Mobile Hamburger Toggle Button (< 768px) -->
      <button class="hamburger-toggle" id="navbarHamburgerBtn" type="button" aria-expanded="false" aria-controls="navbarMenuWrapper" aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
      </button>

      <!-- Navigation Menu (Desktop & Mobile Dropdown) -->
      <div class="nav-menu-wrapper" id="navbarMenuWrapper">
        <ul class="nav-links-list">
          <li class="nav-link-item">
            <a href="{% url 'core:home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
          </li>
          <li class="nav-link-item">
            <a href="{% url 'core:about' %}" class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">About</a>
          </li>
          <li class="nav-link-item">
            <a href="{% url 'departments:department_list' %}" class="{% if request.resolver_match.app_name == 'departments' %}active{% endif %}">Services</a>
          </li>
          <li class="nav-link-item">
            <a href="{% url 'doctors:doctor_list' %}" class="{% if request.resolver_match.app_name == 'doctors' %}active{% endif %}">Doctors</a>
          </li>
          <li class="nav-link-item">
            <a href="{% url 'gallery:gallery_list' %}" class="{% if request.resolver_match.app_name == 'gallery' %}active{% endif %}">Gallery</a>
          </li>
          <li class="nav-link-item">
            <a href="{% url 'core:contact' %}" class="{% if request.resolver_match.url_name == 'contact' %}active{% endif %}">Contact</a>
          </li>
        </ul>

        <!-- Highlighted Book Appointment Button (Right) -->
        <div class="nav-cta-item">
          <a href="{% url 'appointments:book_appointment' %}" class="btn btn-accent-custom shadow-sm">
            <i class="bi bi-calendar-check-fill"></i>
            <span>Book Appointment</span>
          </a>
        </div>
      </div>
    </div>
  </nav>
</header>
